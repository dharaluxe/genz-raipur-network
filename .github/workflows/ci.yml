name: GENZ CI

on:
  push:
    branches:
      - feature/network-v2-oss-intake
      - feature/phase-2-3-commission-engine
      - feature/phase-2-4-opportunity-exchange
      - feature/public-broker-verification
      - phase-2.6/privacy-safe-discovery
      - phase-2.7/master-identity-dedupe
      - phase-2.8/advanced-deal-room
      - phase-2.9/notifications-followups
      - phase-3.0/admin-dispute-control
      - phase-3.1/production-hardening
      - main
  pull_request:
    branches:
      - main
      - phase-2.6/privacy-safe-discovery
      - phase-2.7/master-identity-dedupe
      - phase-2.8/advanced-deal-room
      - phase-2.9/notifications-followups
      - phase-3.0/admin-dispute-control

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build Next.js
        run: npm run build:vercel

      - name: Run domain tests
        run: node --test tests/trust-score.test.mjs tests/network-identity.test.mjs tests/matching-v2.test.mjs tests/commission-v2.test.mjs tests/commission-ledger.test.mjs tests/opportunity-v2.test.mjs tests/public-broker-verification.test.mjs tests/privacy-discovery.test.mjs tests/access-requests.test.mjs tests/master-identity-v2.test.mjs tests/advanced-deal-room.test.mjs tests/notifications-followups.test.mjs tests/admin-dispute-control.test.mjs tests/production-hardening.test.mjs tests/migration-order.test.mjs
